name: Windows build, tests and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Verify brand assets
        run: ./scripts/Build-Assets.ps1
      - name: Restore hash-locked dependencies
        run: dotnet restore KantanPdfSplitter.slnx --locked-mode
      - name: Build
        run: dotnet build KantanPdfSplitter.slnx -c Release --no-restore
      - name: Automated tests and UI contract
        run: |
          $env:KANTAN_UI_EVIDENCE = Join-Path $PWD 'artifacts/ui'
          $env:KANTAN_PDF_EVIDENCE = Join-Path $PWD 'artifacts/pdf-evidence'
          dotnet test KantanPdfSplitter.slnx -c Release --no-build --logger 'trx;LogFileName=tests.trx' --results-directory artifacts/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$results = Get-Content artifacts/tests/tests.trx
          if ([int]$results.TestRun.ResultSummary.Counters.total -lt 78 -or [int]$results.TestRun.ResultSummary.Counters.failed -ne 0) { throw 'Tests did not actually execute successfully.' }
      - name: Independent PDF compatibility and rendering comparison
        run: |
          python -m pip install --disable-pip-version-check pypdf==6.10.0 Pillow==12.3.0 pypdfium2==5.13.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/Verify-PdfEvidence.py artifacts/pdf-evidence pdfium artifacts/tests/independent-rendering.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check runtime dependency advisories
        run: |
          dotnet list src/KantanPdfSplitter/KantanPdfSplitter.csproj package --vulnerable --include-transitive --format json > artifacts/dependency-audit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = Get-Content artifacts/dependency-audit.json -Raw | ConvertFrom-Json
          foreach ($project in $audit.projects) { foreach ($framework in $project.frameworks) { if ($framework.topLevelPackages -or $framework.transitivePackages) { throw 'Vulnerable dependency detected.' } } }
      - name: Publish self-contained Windows app and build NSIS 3.13 installer
        run: ./scripts/Build-Installer.ps1
      - name: Installer lifecycle smoke tests
        run: ./scripts/Test-InstallerSmoke.ps1
      - name: Save compact test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-evidence
          path: |
            artifacts/tests
            artifacts/ui
            artifacts/pdf-evidence
            artifacts/dependency-audit.json
          retention-days: 7
      - name: Save distribution only for release or manual runs
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: KantanPdfSplitter-win-x64
          path: artifacts/dist/*
          retention-days: 7
